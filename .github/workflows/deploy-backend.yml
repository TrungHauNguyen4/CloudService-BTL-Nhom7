name: Deploy Backend to Azure App Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout ma nguon
      uses: actions/checkout@v4

    - name: Cai dat .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/CloudService.WebApi/CloudService.WebApi.csproj

    - name: Publish ung dung (Self-Contained cho Linux)
      run: |
        dotnet publish backend/CloudService.WebApi/CloudService.WebApi.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -o ./publish \
          --no-restore

    - name: Tao file startup.sh
      run: |
        echo '#!/bin/bash' > ./publish/startup.sh
        echo 'echo "Starting custom startup script..."' >> ./publish/startup.sh
        echo 'export DOTNET_ROOT=' >> ./publish/startup.sh
        echo 'export DOTNET_SHARED_STORE=' >> ./publish/startup.sh
        echo 'export DOTNET_HOST_PATH=' >> ./publish/startup.sh
        echo 'chmod +x /home/site/wwwroot/CloudService.WebApi' >> ./publish/startup.sh
        echo 'exec /home/site/wwwroot/CloudService.WebApi' >> ./publish/startup.sh
        chmod +x ./publish/startup.sh

    - name: Deploy len Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'cloudservice-api-nhom7'
        slot-name: 'production'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
