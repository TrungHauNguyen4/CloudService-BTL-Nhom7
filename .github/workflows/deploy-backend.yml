name: Deploy Backend to Azure App Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout ma nguon
      uses: actions/checkout@v4

    # Deploy SOURCE CODE - de Azure Oryx tu build (tranh loi System.Runtime)
    - name: Deploy source code len Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'cloudservice-api-nhom7'
        slot-name: 'production'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./backend
